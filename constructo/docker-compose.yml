services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: constructo
      POSTGRES_PASSWORD: constructo
      POSTGRES_DB: constructo
    ports:
      - "5433:5432"
    volumes:
      - constructo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U constructo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  constructo_pgdata:
