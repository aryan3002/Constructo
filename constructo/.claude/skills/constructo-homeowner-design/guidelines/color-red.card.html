<!-- @dsCard group="Colors" viewport="700x180" name="Red — genuine delay only" subtitle="The one place red appears. Never decorative. White on 600 = 6.6:1" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--page-bg);padding:20px;font-family:var(--font-body);}
  .ramp{display:flex;gap:10px;flex-wrap:wrap;}
  .sw{flex:1;min-width:130px;}
  .block{height:54px;border-radius:var(--radius-md);border:1px solid var(--border);}
  .nm{font-size:12px;color:var(--text-strong);font-weight:600;margin-top:7px;}
  .hx{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);}
  .use{margin-top:16px;}
  .pill{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;background:var(--red-tint);color:var(--red-600);padding:8px 13px;border-radius:var(--radius-pill);font-weight:600;font-size:13px;}
  .note{font-size:12px;color:var(--text-secondary);margin-top:10px;max-width:520px;}
</style></head>
<body>
  <div class="ramp">
    <div class="sw"><div class="block" style="background:var(--red-600)"></div><div class="nm">--red-600</div><div class="hx">#A4382A</div></div>
    <div class="sw"><div class="block" style="background:var(--red-700)"></div><div class="nm">--red-700</div><div class="hx">#862C20</div></div>
    <div class="sw"><div class="block" style="background:var(--red-tint)"></div><div class="nm">--red-tint</div><div class="hx">11%</div></div>
  </div>
  <div class="use"><span class="pill">Plastering delayed ~5 days</span></div>
  <p class="note">Reserved for a real delay or risk that genuinely needs awareness — never for emphasis, errors-as-decoration, or "needs you" choices (that's amber).</p>
</body></html>
