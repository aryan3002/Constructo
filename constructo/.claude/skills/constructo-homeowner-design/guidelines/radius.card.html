<!-- @dsCard group="Spacing" viewport="700x180" name="Radius" subtitle="Soft, residential corners — pebbles, not boxes" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--page-bg);padding:22px;font-family:var(--font-body);}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
  .it{text-align:center;}
  .box{width:84px;height:64px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-card);}
  .nm{font-family:var(--font-mono);font-size:10.5px;color:var(--text-secondary);margin-top:7px;}
</style></head>
<body>
  <div class="row">
    <div class="it"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="nm">sm 12</div></div>
    <div class="it"><div class="box" style="border-radius:var(--radius-md)"></div><div class="nm">md 14 · buttons</div></div>
    <div class="it"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="nm">lg 18 · tiles</div></div>
    <div class="it"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="nm">xl 22 · cards</div></div>
    <div class="it"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="nm">2xl 28 · hero</div></div>
    <div class="it"><div class="box" style="border-radius:var(--radius-pill);width:64px"></div><div class="nm">pill</div></div>
  </div>
</body></html>
