<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing scale" subtitle="4px base grid — generous, calm rhythm with room to breathe" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--page-bg);padding:22px;font-family:var(--font-body);}
  .r{display:flex;align-items:center;gap:14px;padding:4px 0;}
  .tok{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);width:120px;}
  .bar{height:14px;border-radius:4px;background:var(--clay-500);}
  .px{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);}
</style></head>
<body>
  <div class="r"><span class="tok">--space-1</span><span class="bar" style="width:4px"></span><span class="px">4</span></div>
  <div class="r"><span class="tok">--space-2</span><span class="bar" style="width:8px"></span><span class="px">8</span></div>
  <div class="r"><span class="tok">--space-3</span><span class="bar" style="width:12px"></span><span class="px">12</span></div>
  <div class="r"><span class="tok">--space-4</span><span class="bar" style="width:16px"></span><span class="px">16</span></div>
  <div class="r"><span class="tok">--space-6</span><span class="bar" style="width:24px"></span><span class="px">24</span></div>
  <div class="r"><span class="tok">--space-7</span><span class="bar" style="width:32px"></span><span class="px">32</span></div>
  <div class="r"><span class="tok">--space-9</span><span class="bar" style="width:48px"></span><span class="px">48 · tap min</span></div>
</body></html>
