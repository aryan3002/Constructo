<!-- @dsCard group="Colors" viewport="700x170" name="Sand canvas & surfaces" subtitle="Warm, never clinical white — the calm ground everything sits on" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--page-bg);padding:20px;font-family:var(--font-body);}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .sw{flex:1;min-width:110px;}
  .block{height:64px;border-radius:var(--radius-md);border:1px solid var(--border);}
  .nm{font-size:12.5px;color:var(--text-strong);font-weight:600;margin-top:8px;}
  .hx{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);}
  .role{font-size:11px;color:var(--text-secondary);margin-top:1px;}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="block" style="background:var(--sand-50)"></div><div class="nm">--sand-50</div><div class="hx">#FBF7EF</div><div class="role">lifted highlight</div></div>
    <div class="sw"><div class="block" style="background:var(--sand-100)"></div><div class="nm">--sand-100</div><div class="hx">#F8F4EC</div><div class="role">letter / panel</div></div>
    <div class="sw"><div class="block" style="background:var(--sand-200)"></div><div class="nm">--sand-200</div><div class="hx">#F3EFE6</div><div class="role">page canvas</div></div>
    <div class="sw"><div class="block" style="background:var(--sand-300)"></div><div class="nm">--sand-300</div><div class="hx">#ECE5D7</div><div class="role">sunken / track</div></div>
    <div class="sw"><div class="block" style="background:var(--surface)"></div><div class="nm">--surface</div><div class="hx">#FCFAF3</div><div class="role">card surface</div></div>
  </div>
</body></html>
