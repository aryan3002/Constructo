<!-- @dsCard group="Colors" viewport="700x190" name="Secondary — terracotta clay" subtitle="Warm celebration + milestones. Clay-700 for text on sand (5.8:1); 600 for fills" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--page-bg);padding:20px;font-family:var(--font-body);}
  .ramp{display:flex;gap:10px;flex-wrap:wrap;}
  .sw{flex:1;min-width:96px;}
  .block{height:54px;border-radius:var(--radius-md);border:1px solid var(--border);}
  .nm{font-size:12px;color:var(--text-strong);font-weight:600;margin-top:7px;}
  .hx{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);}
  .use{display:flex;gap:12px;align-items:center;margin-top:16px;}
  .pill{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;background:var(--clay-tint);color:var(--clay-700);padding:8px 13px;border-radius:var(--radius-pill);font-weight:600;font-size:13px;}
  .eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--clay-700);font-weight:600;}
</style></head>
<body>
  <div class="ramp">
    <div class="sw"><div class="block" style="background:var(--clay-400)"></div><div class="nm">--clay-400</div><div class="hx">#CF7A53</div></div>
    <div class="sw"><div class="block" style="background:var(--clay-500)"></div><div class="nm">--clay-500</div><div class="hx">#C2673F</div></div>
    <div class="sw"><div class="block" style="background:var(--clay-600)"></div><div class="nm">--clay-600</div><div class="hx">#AE5635</div></div>
    <div class="sw"><div class="block" style="background:var(--clay-700)"></div><div class="nm">--clay-700</div><div class="hx">#92482A</div></div>
    <div class="sw"><div class="block" style="background:var(--clay-tint)"></div><div class="nm">--clay-tint</div><div class="hx">12%</div></div>
  </div>
  <div class="use">
    <span class="eyebrow">Today</span>
    <span class="pill">Milestone · roof slab</span>
  </div>
</body></html>
