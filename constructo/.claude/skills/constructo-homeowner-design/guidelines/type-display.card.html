<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--page-bg);padding:24px;}
  .hero{font-family:var(--font-display);font-weight:500;font-size:46px;line-height:1.0;letter-spacing:-.015em;color:var(--text-strong);}
  .h1{font-family:var(--font-display);font-weight:600;font-size:28px;color:var(--text-strong);margin-top:14px;letter-spacing:-.01em;}
  .meta{font-family:var(--font-body);font-size:12px;color:var(--text-secondary);margin-top:16px;}
</style></head>
<body>
  <div class="hero">You're okay.</div>
  <div class="h1">Your home's journey</div>
  <div class="meta">Eczar · 500 hero / 600 headings · -1.5% tracking · used ONLY for headlines and the 3-second answer</div>
</body></html>
