<!-- @dsCard group="Type" viewport="700x220" name="Body — Hind" subtitle="All reading + UI text. Calm, legible, never below 14px" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--page-bg);padding:24px;font-family:var(--font-body);color:var(--text-body);}
  .p{font-size:15px;line-height:1.45;max-width:560px;color:var(--text-body);}
  .row{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap;}
  .w{font-size:17px;color:var(--text-strong);}
  .w small{display:block;font-size:11px;color:var(--text-secondary);font-weight:400;margin-top:2px;}
</style></head>
<body>
  <p class="p">Roof slab finished. It's curing now — this takes about two weeks, and we'll show you photos along the way. Nothing needs you today.</p>
  <div class="row">
    <div class="w" style="font-weight:300">Aa 300<small>Light</small></div>
    <div class="w" style="font-weight:400">Aa 400<small>Regular · body</small></div>
    <div class="w" style="font-weight:500">Aa 500<small>Medium · labels</small></div>
    <div class="w" style="font-weight:600">Aa 600<small>Semibold · titles</small></div>
    <div class="w" style="font-weight:700">Aa 700<small>Bold · emphasis</small></div>
  </div>
</body></html>
