<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="Mobile-first · serif headlines, sans everything else · 14px floor" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--page-bg);padding:22px;font-family:var(--font-body);}
  .r{display:flex;align-items:baseline;gap:16px;padding:6px 0;border-bottom:1px solid var(--hairline);}
  .r:last-child{border-bottom:0;}
  .tok{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);width:120px;flex-shrink:0;}
  .ex{color:var(--text-strong);}
  .serif{font-family:var(--font-display);}
  .sans{font-family:var(--font-body);}
</style></head>
<body>
  <div class="r"><span class="tok">--fs-hero 44</span><span class="ex serif" style="font-size:36px;font-weight:500">You're okay.</span></div>
  <div class="r"><span class="tok">--fs-h1 28</span><span class="ex serif" style="font-size:26px;font-weight:600">Your home's journey</span></div>
  <div class="r"><span class="tok">--fs-h2 22</span><span class="ex serif" style="font-size:22px;font-weight:600">This week</span></div>
  <div class="r"><span class="tok">--fs-h3 18</span><span class="ex serif" style="font-size:18px;font-weight:600">Roof slab complete</span></div>
  <div class="r"><span class="tok">--fs-title 16</span><span class="ex sans" style="font-size:16px;font-weight:600">Verma Constructions</span></div>
  <div class="r"><span class="tok">--fs-body 15</span><span class="ex sans" style="font-size:15px;color:var(--text-body)">Curing takes about two weeks.</span></div>
  <div class="r"><span class="tok">--fs-body-sm 14</span><span class="ex sans" style="font-size:14px;color:var(--text-secondary)">8 Jun · 6 photos</span></div>
  <div class="r"><span class="tok">--fs-eyebrow 11.5</span><span class="ex sans" style="font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--clay-700);font-weight:600">Today</span></div>
</body></html>
