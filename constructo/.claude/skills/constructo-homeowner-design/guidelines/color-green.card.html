<!-- @dsCard group="Colors" viewport="700x190" name="Primary — sage green" subtitle="Primary actions + “on track”. Nudged warm to sit on sand. White text on 600 = 5.0:1" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--page-bg);padding:20px;font-family:var(--font-body);}
  .ramp{display:flex;gap:10px;flex-wrap:wrap;}
  .sw{flex:1;min-width:96px;}
  .block{height:54px;border-radius:var(--radius-md);border:1px solid var(--border);}
  .nm{font-size:12px;color:var(--text-strong);font-weight:600;margin-top:7px;}
  .hx{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);}
  .use{display:flex;gap:12px;align-items:center;margin-top:16px;}
  .pill{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;background:var(--green-tint);color:var(--green-700);padding:8px 13px;border-radius:var(--radius-pill);font-weight:600;font-size:13px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green-600);}
  .btn{white-space:nowrap;background:var(--green-600);color:#fff;font-weight:600;font-size:14px;padding:11px 18px;border-radius:var(--radius-md);}
</style></head>
<body>
  <div class="ramp">
    <div class="sw"><div class="block" style="background:var(--green-400)"></div><div class="nm">--green-400</div><div class="hx">#6BA48E</div></div>
    <div class="sw"><div class="block" style="background:var(--green-500)"></div><div class="nm">--green-500</div><div class="hx">#4E8C76</div></div>
    <div class="sw"><div class="block" style="background:var(--green-600)"></div><div class="nm">--green-600</div><div class="hx">#3E7A66</div></div>
    <div class="sw"><div class="block" style="background:var(--green-700)"></div><div class="nm">--green-700</div><div class="hx">#2F6151</div></div>
    <div class="sw"><div class="block" style="background:var(--green-tint)"></div><div class="nm">--green-tint</div><div class="hx">12%</div></div>
  </div>
  <div class="use">
    <span class="pill"><span class="dot"></span>On track</span>
    <span class="btn">Primary action</span>
  </div>
</body></html>
