<!-- @dsCard group="Spacing" viewport="700x200" name="Elevation" subtitle="Warm, soft, low — light on sand, never a hard drop shadow" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--page-bg);padding:26px;font-family:var(--font-body);}
  .row{display:flex;gap:22px;flex-wrap:wrap;}
  .it{text-align:center;}
  .box{width:120px;height:74px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);}
  .nm{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:10px;}
</style></head>
<body>
  <div class="row">
    <div class="it"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="nm">--shadow-sm</div></div>
    <div class="it"><div class="box" style="box-shadow:var(--shadow-raise)"></div><div class="nm">--shadow-raise</div></div>
    <div class="it"><div class="box" style="box-shadow:var(--inset-paper),var(--shadow-card)"></div><div class="nm">--shadow-card</div></div>
    <div class="it"><div class="box" style="box-shadow:var(--shadow-pop)"></div><div class="nm">--shadow-pop</div></div>
  </div>
</body></html>
