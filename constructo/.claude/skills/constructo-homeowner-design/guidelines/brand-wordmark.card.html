<!-- @dsCard group="Brand" viewport="700x210" name="Wordmark (placeholder)" subtitle="Type-led lockup — Eczar wordmark + house mark. Real logo asset pending from client" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--page-bg);padding:26px;font-family:var(--font-body);}
  .lockup{display:flex;align-items:center;gap:16px;}
  .mark{width:60px;height:60px;border-radius:16px;background:var(--clay-600);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-card);}
  .mark svg{width:32px;height:32px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .name{font-family:var(--font-display);font-weight:600;font-size:38px;color:var(--text-strong);letter-spacing:-.01em;line-height:1;}
  .tag{font-family:var(--font-body);font-size:13px;color:var(--text-secondary);margin-top:4px;letter-spacing:.02em;}
  .alt{display:flex;gap:14px;margin-top:22px;align-items:center;}
  .chip{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;}
  .chip svg{width:22px;height:22px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .note{font-size:11.5px;color:var(--text-secondary);margin-top:16px;max-width:540px;}
</style></head>
<body>
  <div class="lockup">
    <div class="mark"><svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>
    <div>
      <div class="name">Constructo</div>
      <div class="tag">Calm Cockpit · your home, in good hands</div>
    </div>
  </div>
  <div class="alt">
    <div class="chip" style="background:var(--clay-600)"><svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>
    <div class="chip" style="background:var(--green-600)"><svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>
    <div class="chip" style="background:var(--ink-900)"><svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>
  </div>
  <p class="note">Placeholder identity built from the bundled house mark + Eczar wordmark. No client logo was provided — replace with the real asset when available.</p>
</body></html>
