<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Constructo · Home Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Eczar:wght@400;500;600;700&family=Mukta:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600&family=Hind:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #e9e6e0; }

  /* ===================== Shared phone shell ===================== */
  .screen {
    width: 390px; height: 844px;
    overflow: hidden; position: relative;
    display: flex; flex-direction: column;
  }
  .statusbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px 0; font-size: 14px; font-weight: 600;
    flex-shrink: 0;
  }
  .statusbar .sb-icons { display: flex; gap: 7px; align-items: center; font-size: 15px; }
  .body { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .scroll { flex: 1; overflow: hidden; padding: 0 22px; }
  .toggle {
    display: inline-flex; align-items: center; border-radius: 999px;
    font-size: 13px; font-weight: 600; overflow: hidden;
  }
  .toggle span { padding: 6px 12px; line-height: 1; }

  /* ===================== Direction A · Aangan ===================== */
  .A {
    --paper:#F4ECDF; --surface:#FCF7EE; --ink:#2E2418; --ink-soft:#7A6A55;
    --clay:#B25B3B; --sage:#5E7A4E; --amber:#B5862B; --brick:#A4382A;
    --line:rgba(46,36,24,.10);
    background:
      radial-gradient(120% 70% at 50% -10%, #FAF3E8 0%, var(--paper) 55%);
    color: var(--ink);
    font-family: 'Mukta', sans-serif;
  }
  .A .statusbar { color: var(--ink); }
  .A .head {
    display:flex; align-items:flex-start; justify-content:space-between;
    padding: 18px 4px 6px;
  }
  .A .greet { font-size:14px; color:var(--ink-soft); font-weight:500; letter-spacing:.01em; white-space:nowrap; }
  .A .date { font-size:12.5px; color:var(--ink-soft); opacity:.8; margin-top:2px; }
  .A .toggle { border:1px solid var(--line); background:rgba(255,255,255,.5); }
  .A .toggle span.on { background:var(--ink); color:var(--paper); border-radius:999px; }
  .A .toggle span.off { color:var(--ink-soft); }

  .A .hero { padding: 22px 4px 10px; }
  .A .eyebrow {
    font-size:11.5px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--clay); font-weight:600; margin-bottom:10px;
  }
  .A .answer {
    font-family:'Eczar', serif; font-weight:500; font-size:46px; line-height:1.02;
    letter-spacing:-.01em;
  }
  .A .answer .sub { display:block; font-size:22px; font-weight:400; color:var(--ink-soft); margin-top:12px; line-height:1.25; letter-spacing:0; }

  .A .pill {
    display:inline-flex; align-items:center; gap:8px; margin-top:20px;
    background:rgba(94,122,78,.12); color:#46603a; border:1px solid rgba(94,122,78,.25);
    padding:9px 15px 9px 12px; border-radius:999px; font-weight:600; font-size:14.5px; white-space:nowrap;
  }
  .A .pill .dot { width:8px; height:8px; border-radius:50%; background:var(--sage); }

  .A .card {
    background:var(--surface); border:1px solid var(--line); border-radius:22px;
    padding:18px; margin-top:18px; box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 10px 24px -18px rgba(46,36,24,.35);
  }
  .A .card-label { font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; }
  /* journey line */
  .A .journey { margin-top:18px; }
  .A .jline { position:relative; height:3px; background:linear-gradient(90deg,var(--clay),rgba(178,91,59,.25)); border-radius:3px; margin:26px 6px 8px; }
  .A .jtick { position:absolute; top:-4.5px; width:11px; height:11px; border-radius:50%; background:var(--paper); border:2px solid rgba(178,91,59,.5); transform:translateX(-50%); }
  .A .jtick.done { background:var(--clay); border-color:var(--clay); }
  .A .jhere {
    position:absolute; top:-9px; width:21px; height:21px; border-radius:50%;
    background:var(--clay); border:4px solid var(--surface); transform:translateX(-50%);
    box-shadow:0 0 0 4px rgba(178,91,59,.18);
  }
  .A .jlabels { display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin:0 4px; }
  .A .jnow { display:flex; align-items:baseline; justify-content:space-between; margin-top:14px; }
  .A .jnow b { font-family:'Eczar',serif; font-weight:600; font-size:19px; color:var(--ink); }
  .A .jnow .when { font-size:13px; color:var(--ink-soft); }

  .A .update { display:flex; gap:14px; align-items:flex-start; margin-top:16px; }
  .A .photo {
    width:74px; height:74px; border-radius:16px; flex-shrink:0; overflow:hidden;
    background:linear-gradient(135deg,#cdb89a,#a98d6b); position:relative;
    display:flex; align-items:flex-end; justify-content:flex-start;
  }
  .A .photo i { color:rgba(255,255,255,.85); font-size:16px; margin:7px; }
  .A .upbody { flex:1; }
  .A .uptime { font-size:12.5px; color:var(--clay); font-weight:600; }
  .A .uptext { font-size:15.5px; line-height:1.35; margin-top:3px; color:var(--ink); }
  .A .proof { display:inline-flex; align-items:center; gap:6px; margin-top:9px; font-size:13px; font-weight:600; color:var(--ink-soft); }

  .A .nav {
    flex-shrink:0; display:flex; justify-content:space-around; padding:12px 16px 26px;
    border-top:1px solid var(--line); background:rgba(252,247,238,.85); backdrop-filter:blur(8px);
  }
  .A .nav a { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; color:var(--ink-soft); text-decoration:none; }
  .A .nav a i { font-size:23px; }
  .A .nav a.active { color:var(--clay); }

  /* ===================== Direction B · Aakaash ===================== */
  .B {
    --bg:#EAEFEC; --surface:#FCFEFD; --ink:#1E2A2C; --ink-soft:#62716F;
    --teal:#2E8B7F; --teal-deep:#1F6E63; --sand:#E7D9C5; --ochre:#BC8A2E; --coral:#C2584A;
    --line:rgba(30,42,44,.07);
    background:linear-gradient(180deg,#EDF2EF 0%, #E6ECE9 100%);
    color:var(--ink);
    font-family:'Hind', sans-serif;
  }
  .B .statusbar { color:var(--ink); }
  .B .head { display:flex; align-items:center; justify-content:space-between; padding:16px 2px 4px; }
  .B .greet { font-family:'Poppins',sans-serif; font-size:15px; font-weight:500; }
  .B .greet span { display:block; font-size:12.5px; color:var(--ink-soft); font-weight:400; font-family:'Hind'; }
  .B .toggle { background:rgba(255,255,255,.7); border:1px solid var(--line); }
  .B .toggle span.on { background:var(--teal); color:#fff; border-radius:999px; }
  .B .toggle span.off { color:var(--ink-soft); }

  /* daylight reassurance card — signature */
  .B .daylight {
    margin-top:16px; border-radius:28px; padding:26px 24px 24px;
    background:
      radial-gradient(120% 90% at 80% 0%, rgba(46,139,127,.16), transparent 60%),
      linear-gradient(180deg,#FFFFFF, #F7FBF9);
    border:1px solid var(--line);
    box-shadow:0 18px 40px -26px rgba(31,110,99,.45);
    position:relative; overflow:hidden;
  }
  .B .halo {
    width:56px; height:56px; border-radius:50%;
    background:radial-gradient(circle at 50% 45%, #4FB3A2, #2E8B7F);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:30px;
    box-shadow:0 0 0 8px rgba(46,139,127,.10), 0 8px 18px -8px rgba(46,139,127,.6);
  }
  .B .daylight .answer { font-family:'Poppins',sans-serif; font-weight:500; font-size:32px; line-height:1.08; margin-top:18px; letter-spacing:-.01em; }
  .B .daylight .sub { font-size:16px; color:var(--ink-soft); margin-top:8px; line-height:1.4; }
  .B .daylight .meta { display:flex; align-items:center; gap:7px; margin-top:18px; font-size:13.5px; color:var(--teal-deep); font-weight:500; white-space:nowrap; }

  /* time bar segmented */
  .B .card { background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:18px; margin-top:14px; box-shadow:0 10px 26px -22px rgba(30,42,44,.4); }
  .B .card-head { display:flex; align-items:center; justify-content:space-between; }
  .B .card-label { font-family:'Poppins',sans-serif; font-size:13.5px; font-weight:500; }
  .B .card-when { font-size:12.5px; color:var(--ink-soft); }
  .B .timebar { display:flex; gap:5px; margin-top:16px; }
  .B .seg { height:8px; border-radius:6px; flex:1; background:rgba(30,42,44,.08); position:relative; }
  .B .seg.done { background:var(--teal); }
  .B .seg.here { background:var(--teal); }
  .B .seg.here::after { content:''; position:absolute; right:-3px; top:-5px; width:18px; height:18px; border-radius:50%; background:var(--teal); border:4px solid var(--surface); box-shadow:0 0 0 3px rgba(46,139,127,.2); }
  .B .phase { display:flex; align-items:baseline; justify-content:space-between; margin-top:16px; }
  .B .phase b { font-family:'Poppins'; font-weight:500; font-size:17px; }
  .B .phase .pos { font-size:13px; color:var(--ink-soft); }

  .B .update { display:flex; gap:14px; align-items:center; }
  .B .photo { width:66px; height:66px; border-radius:16px; flex-shrink:0; background:linear-gradient(135deg,#b9c4bd,#8a9b94); position:relative; }
  .B .photo i { position:absolute; bottom:6px; left:7px; color:rgba(255,255,255,.85); font-size:15px; }
  .B .upbody { flex:1; }
  .B .uptime { font-size:12.5px; color:var(--teal-deep); font-weight:600; }
  .B .uptext { font-size:15px; line-height:1.35; margin-top:2px; }

  .B .nav {
    flex-shrink:0; margin:10px 18px 22px; padding:12px 10px; display:flex; justify-content:space-around;
    background:rgba(255,255,255,.85); backdrop-filter:blur(10px);
    border:1px solid var(--line); border-radius:24px; box-shadow:0 12px 30px -18px rgba(30,42,44,.4);
  }
  .B .nav a { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; color:var(--ink-soft); text-decoration:none; }
  .B .nav a i { font-size:22px; }
  .B .nav a.active { color:var(--teal); }
  .B .nav a.active i { color:var(--teal); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function StatusBar() {
  return (
    <div className="statusbar">
      <span>9:41</span>
      <span className="sb-icons">
        <i className="ph-fill ph-cell-signal-full"></i>
        <i className="ph-fill ph-wifi-high"></i>
        <i className="ph-fill ph-battery-full"></i>
      </span>
    </div>
  );
}

function ScreenA() {
  return (
    <div className="screen A">
      <StatusBar />
      <div className="body">
        <div className="scroll">
          <div className="head">
            <div>
              <div className="greet">Good morning, Priya</div>
              <div className="date">Friday, 7 June</div>
            </div>
            <div className="toggle"><span className="on">EN</span><span className="off">हिं</span></div>
          </div>

          <div className="hero">
            <div className="eyebrow">Today</div>
            <div className="answer">You're okay.
              <span className="sub">Nothing needs you today.</span>
            </div>
            <div className="pill"><span className="dot"></span><i className="ph ph-check-circle"></i> On track</div>
          </div>

          <div className="card journey">
            <div className="card-label">Your home's journey</div>
            <div className="jline">
              <div className="jtick done" style={{left:'0%'}}></div>
              <div className="jtick done" style={{left:'22%'}}></div>
              <div className="jhere" style={{left:'46%'}}></div>
              <div className="jtick" style={{left:'72%'}}></div>
              <div className="jtick" style={{left:'100%'}}></div>
            </div>
            <div className="jlabels"><span>Start · Mar</span><span>Handover · Dec</span></div>
            <div className="jnow"><b>Brickwork &amp; walls</b><span className="when">about halfway</span></div>
          </div>

          <div className="card">
            <div className="update">
              <div className="photo"><i className="ph-fill ph-image"></i></div>
              <div className="upbody">
                <div className="uptime">2 days ago</div>
                <div className="uptext">Roof slab finished. It's curing now — this takes about two weeks.</div>
                <div className="proof"><i className="ph ph-images"></i> 6 photos · Show proof</div>
              </div>
            </div>
          </div>
        </div>

        <div className="nav">
          <a className="active"><i className="ph-fill ph-house"></i>Home</a>
          <a><i className="ph ph-path"></i>Journey</a>
          <a><i className="ph ph-images"></i>Photos</a>
          <a><i className="ph ph-wallet"></i>Money</a>
        </div>
      </div>
    </div>
  );
}

function ScreenB() {
  return (
    <div className="screen B">
      <StatusBar />
      <div className="body">
        <div className="scroll">
          <div className="head">
            <div className="greet">Hi Priya<span>Friday, 7 June</span></div>
            <div className="toggle"><span className="on">EN</span><span className="off">हिं</span></div>
          </div>

          <div className="daylight">
            <div className="halo"><i className="ph ph-check"></i></div>
            <div className="answer">All calm.</div>
            <div className="sub">Nothing needs you today. We'll tell you the moment it does.</div>
            <div className="meta"><i className="ph-fill ph-sun"></i> On track · last checked 1h ago</div>
          </div>

          <div className="card">
            <div className="card-head">
              <span className="card-label">Start → Handover</span>
              <span className="card-when">Mar – Dec</span>
            </div>
            <div className="timebar">
              <div className="seg done"></div>
              <div className="seg done"></div>
              <div className="seg here"></div>
              <div className="seg"></div>
              <div className="seg"></div>
            </div>
            <div className="phase"><b>Brickwork &amp; walls</b><span className="pos">you are here</span></div>
          </div>

          <div className="card">
            <div className="update">
              <div className="photo"><i className="ph-fill ph-image"></i></div>
              <div className="upbody">
                <div className="uptime">2 days ago</div>
                <div className="uptext">Roof slab finished — now curing for ~2 weeks.</div>
              </div>
            </div>
          </div>
        </div>

        <div className="nav">
          <a className="active"><i className="ph-fill ph-house"></i>Home</a>
          <a><i className="ph ph-path"></i>Journey</a>
          <a><i className="ph ph-images"></i>Photos</a>
          <a><i className="ph ph-wallet"></i>Money</a>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <DesignCanvas>
    <DCSection id="home" title="The “Am I okay?” Home screen" subtitle="Two directions — pick one to develop into the full system">
      <DCArtboard id="a" label="A · Aangan — warm editorial (Eczar + Mukta)" width={390} height={844}><ScreenA /></DCArtboard>
      <DCArtboard id="b" label="B · Aakaash — daylight calm (Poppins + Hind)" width={390} height={844}><ScreenB /></DCArtboard>
    </DCSection>
  </DesignCanvas>
);
</script>
</body>
</html>
