# Homeowner (Calm Cockpit) regression smoke. The join form has 4 unlabelled
# TextInputs (name, code, phone, OTP) with no testIDs, so the multi-field entry
# is finicky for a static flow — completing the join + walking tabs is done
# interactively in the QA agent. This flow proves the chooser -> join route and
# captures the Calm Cockpit join screen (sage/sand, NOT Neev marigold).
appId: host.exp.Exponent
---
- assertVisible: "Who are you?"
- tapOn: "I'm a homeowner"
- assertVisible: "Join your home"
- takeScreenshot: /tmp/qa_neev/homeowner_join
