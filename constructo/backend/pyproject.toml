[project]
name = "constructo-backend"
version = "0.1.0"
description = "Constructo backend foundation (Wave 0)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rq>=2.0",
    "redis>=5.2",
    "apscheduler>=3.11",
    "openai>=1.55",
    "pgvector>=0.4.2",
    "boto3>=1.43.20",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI deliberately calls Depends()/Header() in argument defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# events.py is the verbatim cross-agent contract; keep it exactly as specified.
"app/contracts/events.py" = ["UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
